name: gestor-finanzas-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestor_finanzas}
      POSTGRES_USER: ${POSTGRES_USER:-gestor_finanzas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestor_finanzas_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-dev-data:
